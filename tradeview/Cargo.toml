[workspace]
members = [
    "crates/common",
    "crates/domain",
    "crates/clock",
    "crates/broker-core",
    "crates/market-calendar",
    "crates/oms",
    "crates/risk-engine",
    "crates/execution-sim",
    "crates/market-data",
    "crates/candle-engine",
    "crates/indicators",
    "crates/broker-ibkr",
    "crates/event-store",
    "crates/api",
    "apps/tradeview-server",
    "apps/ibkr-probe",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
futures-util = "0.3"
thiserror = "1.0"
async-trait = "0.1"
chrono-tz = "0.10"
proptest = "1.5"
